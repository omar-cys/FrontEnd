<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Zental Clinic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body onload="updateServices()">
    <div class="nav">
        <a href="home.html">Home</a>
        <a href="appointments.html">Appointments</a>
        <a href="reports.html">Reports</a>
        <a href="login.html" onclick="logout()">Logout</a>
    </div>
    <div class="container mt-4 mb-4">
        <h2>Book Appointment</h2>
        <input id="name" type="text" placeholder="Patient Name">
        <select id="doctor" onchange="updateServices()">
            <option value="Dr. Lusine Qablan">Dr. Lusine Qablan</option>
            <option value="Dr. Tareq Amare">Dr. Tareq Amare</option>
            <option value="Dr. Rame Mohammed">Dr. Rame Mohammed</option>
            <option value="Dr. Omar Ahmad">Dr. Omar Ahmad</option>
        </select>
        <select id="service"></select>
        <button id="mainButton" onclick="book()">Book Appointment</button>
        <h3 class="mt-4">Appointments</h3>
        <div id="list"></div>
    </div>
    <footer class="footer">
        <p>© 2026 Zental Dental Clinic</p>
        <p>Developed by Omar</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
